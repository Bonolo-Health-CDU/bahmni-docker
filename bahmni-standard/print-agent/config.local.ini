[odoo]
url = http://localhost:8071
db = odoo
username = cdu.admin
password = eLMIS@1234
timeout_seconds = 30

[agent]
name = CDU-PRINT-AGENT-DEMO
poll_interval_seconds = 5
job_limit = 20
dry_run = false
dry_run_output_dir = printed-output

[printer.product_printer]
type = raw_tcp
host = 192.168.26.43
port = 9100

[printer.bagging_printer]
type = raw_tcp
host = 192.168.26.40
port = 9100

[printer.dispensing_receipt_printer]
type = command
queue = CDU_RECEIPT
command = python3 scripts/print_escpos_receipt.py --queue CDU_RECEIPT {file}

[printer.box_label_printer]
type = raw_tcp
host = 192.168.26.41
port = 9100

[printer.document_printer]
type = command
queue = CDU_DOCUMENT
