[odoo]
url = https://cdustaging.bonolohealth.gov.ls
db = odoo
username = print_agent
password = replace-with-api-key
timeout_seconds = 15

[agent]
name = CDU-PRINT-AGENT-PC1
poll_interval_seconds = 5
job_limit = 20
dry_run = false
dry_run_output_dir = printed-output

[election]
enabled = true
hostname =
priority = 100
port = 47990
broadcast_interval_seconds = 2
peer_timeout_seconds = 6
bind_host =
broadcast_address = 255.255.255.255
force_active = false

[ui]
host = 127.0.0.1
port = 8765
refresh_seconds = 3

[printer.product_printer]
type = raw_tcp
host = 192.168.26.43
port = 9100
test_language = tspl

[printer.bagging_printer]
type = raw_tcp
host = 192.168.26.40
port = 9100
test_language = zpl

[printer.box_label_printer]
type = raw_tcp
host = 192.168.26.41
port = 9100
test_language = zpl

[printer.dispensing_receipt_printer]
type = command
command = powershell -ExecutionPolicy Bypass -File {config_dir}/scripts/print_pdf_windows.ps1 -PrinterName "CDU_RECEIPT" -File {file}
test_language = pdf

[printer.document_printer]
type = command
command = powershell -ExecutionPolicy Bypass -File {config_dir}/scripts/print_pdf_windows.ps1 -PrinterName "CDU_DOCUMENT" -File {file}
test_language = pdf
