[odoo]
url = http://localhost:8071
db = odoo
username = print_agent
password = change-me
timeout_seconds = 30

[agent]
name = CDU-PRINT-AGENT-DEMO
poll_interval_seconds = 5
job_limit = 20
dry_run = true
dry_run_output_dir = printed-output

[election]
enabled = false
priority = 100
port = 47990
broadcast_interval_seconds = 2
peer_timeout_seconds = 6
bind_host =
broadcast_address = 255.255.255.255
force_active = false

[ui]
host = 127.0.0.1
port = 8765
refresh_seconds = 3

[printer.product_printer]
type = dry_run
test_language = tspl

[printer.bagging_printer]
type = dry_run
test_language = zpl

[printer.dispensing_receipt_printer]
type = dry_run
test_language = pdf

[printer.box_label_printer]
type = dry_run
test_language = zpl

[printer.document_printer]
type = dry_run
test_language = pdf
